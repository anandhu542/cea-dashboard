<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEA Environment Dashboard</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #1b2530;
    --card-border: #2c3a48;
    --text: #e6edf3;
    --muted: #8b98a5;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.4rem; margin: 0; }
  #status {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
  }
  #status.connected { color: var(--ok); }
  #status.disconnected { color: var(--bad); }

  #alertBanner {
    display: none;
    background: var(--bad);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card .value {
    font-size: 1.6rem;
    font-weight: 600;
    margin-top: 4px;
  }
  .card .unit {
    font-size: 0.85rem;
    color: var(--muted);
    margin-left: 4px;
  }

  .relays {
    margin-top: 24px;
  }
  .relays h2 {
    font-size: 1rem;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .relay-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pill {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    border: 1px solid var(--card-border);
    background: var(--card);
  }
  .pill.on { border-color: var(--ok); color: var(--ok); }
  .pill.off { color: var(--muted); }

  footer {
    margin-top: 24px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>CEA Environment Dashboard</h1>
  <span id="status" class="disconnected">Connecting…</span>
</header>

<div id="alertBanner">⚠ Sensor alert active — check TDS / turbidity / CO2</div>

<div class="grid">
  <div class="card"><div class="label">Temperature</div><div class="value" id="temp">—<span class="unit">°C</span></div></div>
  <div class="card"><div class="label">Humidity</div><div class="value" id="humidity">—<span class="unit">%</span></div></div>
  <div class="card"><div class="label">CO₂</div><div class="value" id="co2">—<span class="unit">ppm</span></div></div>
  <div class="card"><div class="label">Light</div><div class="value" id="lux">—<span class="unit">lux</span></div></div>
  <div class="card"><div class="label">TDS</div><div class="value" id="tds">—<span class="unit">ppm</span></div></div>
  <div class="card"><div class="label">Turbidity</div><div class="value" id="turbidity">—<span class="unit">V</span></div></div>
  <div class="card"><div class="label">Dust (PM)</div><div class="value" id="dust">—<span class="unit">µg/m³</span></div></div>
</div>

<div class="relays">
  <h2>Actuators</h2>
  <div class="relay-row">
    <span class="pill off" id="relay1">Heater/Relay1</span>
    <span class="pill off" id="relay2">Light/Relay2</span>
    <span class="pill off" id="relay3">Dust/Relay3</span>
    <span class="pill off" id="pump">Water Pump</span>
    <span class="pill off" id="vacuum">Vacuum Motor</span>
  </div>
</div>

<footer id="lastUpdate">Waiting for data…</footer>

<script>
async function refresh() {
  try {
    const res = await fetch('/data');
    const d = await res.json();

    const statusEl = document.getElementById('status');
    if (d._connected) {
      statusEl.textContent = 'Connected';
      statusEl.className = 'connected';
    } else {
      statusEl.textContent = 'Serial disconnected';
      statusEl.className = 'disconnected';
    }

    const setVal = (id, val, decimals) => {
      const el = document.getElementById(id).firstChild;
      if (val === undefined || val === null) return;
      el.textContent = (typeof val === 'number' && decimals !== undefined)
        ? val.toFixed(decimals) : val;
    };

    setVal('temp', d.temp, 1);
    setVal('humidity', d.humidity, 1);
    setVal('co2', d.co2, 0);
    setVal('lux', d.lux, 1);
    setVal('tds', d.tds, 0);
    setVal('turbidity', d.turbidity, 2);
    setVal('dust', d.dust, 1);

    const setPill = (id, on) => {
      const el = document.getElementById(id);
      el.classList.toggle('on', !!on);
      el.classList.toggle('off', !on);
    };
    setPill('relay1', d.relay1);
    setPill('relay2', d.relay2);
    setPill('relay3', d.relay3);
    setPill('pump', d.pump);
    setPill('vacuum', d.vacuum);

    document.getElementById('alertBanner').style.display = d.alert ? 'block' : 'none';

    if (d._last_update) {
      const t = new Date(d._last_update);
      document.getElementById('lastUpdate').textContent =
        'Last update: ' + t.toLocaleTimeString();
    }
  } catch (err) {
    document.getElementById('status').textContent = 'Server unreachable';
    document.getElementById('status').className = 'disconnected';
  }
}

refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
